name: Feature request
description: Suggest an idea for HyPack
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    value: |
      Share an idea for HyPack. Feature requests help us prioritize what to build next.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve? Who benefits?
      placeholder: As a modpack creator, I want to…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Modpack builder
        - Explore / discovery
        - Export
        - Auth / accounts
        - Blog / guides / changelog
        - UI / design
        - API / backend
        - Other
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for similar requests
          required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, links, or examples from other tools.
